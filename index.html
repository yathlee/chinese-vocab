<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chinese Vocab Practice</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#1d2433;--muted:#6b7385;--accent:#3b6cf6;--ok:#1f9d55;--bad:#d64545;--soft:#e8eefc}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Segoe UI",Roboto,"PingFang SC","PingFang HK","Microsoft YaHei","Microsoft JhengHei","Noto Sans CJK SC","Noto Sans CJK TC",sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
h1{font-size:20px;margin:0}
.btn{border:0;border-radius:12px;padding:12px 16px;font-size:16px;cursor:pointer;background:var(--soft);color:var(--ink);font-family:inherit}
.btn.primary{background:var(--accent);color:#fff}
.btn.ok{background:var(--ok);color:#fff}.btn.bad{background:var(--bad);color:#fff}
.btn.small{padding:8px 12px;font-size:14px}
.btn:active{transform:scale(.98)}
.panel{background:var(--card);border-radius:18px;padding:18px;box-shadow:0 2px 10px rgba(0,0,0,.05);margin-bottom:14px}
.label{font-size:13px;color:var(--muted);margin:0 0 8px;text-transform:uppercase;letter-spacing:.05em}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--soft);background:#fff;border-radius:999px;padding:8px 14px;font-size:15px;cursor:pointer;font-family:inherit}
.chip.on{border-color:var(--accent);background:var(--soft);font-weight:600}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{padding:16px;border-radius:16px;background:var(--soft);border:0;text-align:left;cursor:pointer;font-family:inherit;color:var(--ink)}
.mode b{display:block;font-size:17px;margin-bottom:4px}.mode span{font-size:13px;color:var(--muted)}
.bar{height:8px;background:var(--soft);border-radius:99px;overflow:hidden;margin:6px 0 14px}
.bar>div{height:100%;background:var(--accent);transition:width .3s}
.stats{display:flex;justify-content:space-between;font-size:14px;color:var(--muted)}
.flash{min-height:320px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;cursor:pointer;user-select:none}
.big{font-size:56px;font-weight:700;letter-spacing:.05em}
.py{font-size:22px;color:var(--accent);margin:6px 0}
.mean{font-size:20px;font-weight:600;margin:4px 0}
.pos{display:inline-block;font-size:12px;background:var(--soft);border-radius:99px;padding:3px 10px;color:var(--muted)}
.ex{margin-top:14px;font-size:19px;line-height:1.6}
.exen{font-size:14px;color:var(--muted)}
.tip{margin-top:12px;font-size:14px;background:#fff8e6;border-radius:10px;padding:8px 12px;text-align:left}
.hint{font-size:13px;color:var(--muted);margin-top:14px}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.q{font-size:22px;line-height:1.6;margin:6px 0 16px;text-align:center}
.q .cn{font-size:30px;font-weight:700}
.opts{display:grid;gap:10px}
.opt{border:2px solid var(--soft);background:#fff;border-radius:14px;padding:14px;font-size:18px;text-align:left;cursor:pointer;font-family:inherit;color:var(--ink)}
.opt.right{border-color:var(--ok);background:#e7f7ee}.opt.wrong{border-color:var(--bad);background:#fdecec}
.fb{margin-top:12px;font-size:15px;min-height:22px}
.fb.ok{color:var(--ok)}.fb.bad{color:var(--bad)}
.score{font-size:48px;font-weight:800;text-align:center}
.missed{list-style:none;padding:0;margin:0}.missed li{padding:8px 0;border-bottom:1px solid var(--soft)}
.streak{font-weight:700;color:#e8890c}
.cele{text-align:center;font-size:40px;animation:pop .6s ease}
@keyframes pop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.2)}100%{transform:scale(1);opacity:1}}
.hidden{display:none}
@media(max-width:480px){.big{font-size:44px}.modes{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const W = [{"set": 1, "s": "绝望", "s_t": "絕望", "py": "jué wàng", "m": "desperation / despair", "pos": "noun / verb", "ex": "考试失败后，他感到非常绝望。", "ex_t": "考試失敗後，他感到非常絕望。", "exen": "After failing the exam, he felt hopeless.", "tip": "感到绝望 / 陷入绝望 / 对……感到绝望. Stronger than 沮丧.", "bl": "面对巨大的压力，有些学生甚至陷入了___。", "bl_t": "面對巨大的壓力，有些學生甚至陷入了___。"}, {"set": 1, "s": "额外", "s_t": "額外", "py": "é wài", "m": "additional / extra", "pos": "adjective", "ex": "很多家长给孩子报了额外的补习班。", "ex_t": "很多家長給孩子報了額外的補習班。", "exen": "Many parents sign their children up for extra tutoring classes.", "tip": "额外的 + noun (额外的作业 / 额外的费用), or 额外 + verb (额外收费).", "bl": "老师今天给我们布置了很多___的作业。", "bl_t": "老師今天給我們佈置了很多___的作業。"}, {"set": 1, "s": "茁壮", "s_t": "茁壯", "py": "zhuó zhuàng", "m": "healthy and strong / sturdy", "pos": "adjective", "ex": "小树在阳光下长得很茁壮。", "ex_t": "小樹在陽光下長得很茁壯。", "exen": "The young tree grew sturdy in the sunlight.", "tip": "Describes plants or children growing healthily: 长得很茁壮. Most often seen inside 茁壮成长.", "bl": "经过农民的细心照料，庄稼长得十分___。", "bl_t": "經過農民的細心照料，莊稼長得十分___。"}, {"set": 1, "s": "起跑线", "s_t": "起跑線", "py": "qǐ pǎo xiàn", "m": "starting line", "pos": "noun", "ex": "很多父母不想让孩子输在起跑线上。", "ex_t": "很多父母不想讓孩子輸在起跑線上。", "exen": "Many parents don't want their children to fall behind at the starting line.", "tip": "Fixed essay phrase: 不要让孩子输在起跑线上 (about early academic pressure).", "bl": "为了不让孩子输在___上，父母让他三岁就开始学英语。", "bl_t": "為了不讓孩子輸在___上，父母讓他三歲就開始學英語。"}, {"set": 1, "s": "负面影响", "s_t": "負面影響", "py": "fù miàn yǐng xiǎng", "m": "negative impact / adverse effect", "pos": "noun", "ex": "长时间玩手机会对学习产生负面影响。", "ex_t": "長時間玩手機會對學習產生負面影響。", "exen": "Using a phone for long periods has a negative impact on studying.", "tip": "对……产生 / 造成 / 带来负面影响. Opposite: 正面影响 / 积极影响.", "bl": "过多的考试压力会给学生的身心健康带来___。", "bl_t": "過多的考試壓力會給學生的身心健康帶來___。"}, {"set": 1, "s": "延续", "s_t": "延續", "py": "yán xù", "m": "to extend / to continue", "pos": "verb", "ex": "这个传统已经延续了几百年。", "ex_t": "這個傳統已經延續了幾百年。", "exen": "This tradition has continued for hundreds of years.", "tip": "Used for traditions, culture, life: 延续传统 / 延续生命. For continuing an action, use 继续.", "bl": "我们应该保护和___中国的传统文化。", "bl_t": "我們應該保護和___中國的傳統文化。"}, {"set": 1, "s": "违背", "s_t": "違背", "py": "wéi bèi", "m": "to violate / to go against", "pos": "verb", "ex": "他违背了自己的承诺。", "ex_t": "他違背了自己的承諾。", "exen": "He broke his own promise.", "tip": "违背 + 承诺 / 意愿 / 良心 / 规律. For laws and rules use 违反 (违反校规).", "bl": "父母不应该___孩子的意愿，强迫他们学自己不喜欢的东西。", "bl_t": "父母不應該___孩子的意願，強迫他們學自己不喜歡的東西。"}, {"set": 1, "s": "敷衍", "s_t": "敷衍", "py": "fū yǎn", "m": "to be perfunctory / to go through the motions", "pos": "verb / adjective", "ex": "他做作业总是敷衍了事。", "ex_t": "他做作業總是敷衍了事。", "exen": "He always rushes through his homework without real effort.", "tip": "敷衍了事 (do something just to get it over with); 敷衍某人 (brush someone off).", "bl": "他不想认真回答，只是随便___了几句。", "bl_t": "他不想認真回答，只是隨便___了幾句。"}, {"set": 1, "s": "急躁", "s_t": "急躁", "py": "jí zào", "m": "irritable / impetuous", "pos": "adjective", "ex": "爸爸脾气急躁，经常大声说话。", "ex_t": "爸爸脾氣急躁，經常大聲説話。", "exen": "Dad is short-tempered and often raises his voice.", "tip": "性格急躁 / 脾气急躁. Opposite: 有耐心 / 冷静.", "bl": "遇到问题时不要___，要冷静下来想办法。", "bl_t": "遇到問題時不要___，要冷靜下來想辦法。"}, {"set": 1, "s": "沮丧", "s_t": "沮喪", "py": "jǔ sàng", "m": "frustrated / dejected", "pos": "adjective", "ex": "比赛输了，队员们都很沮丧。", "ex_t": "比賽輸了，隊員們都很沮喪。", "exen": "After losing the match, the players were all dejected.", "tip": "感到沮丧 / 心情沮丧. Milder than 绝望.", "bl": "这次考试成绩不理想，他感到很___。", "bl_t": "這次考試成績不理想，他感到很___。"}, {"set": 1, "s": "休学", "s_t": "休學", "py": "xiū xué", "m": "to suspend schooling", "pos": "verb", "ex": "她因为生病不得不休学一年。", "ex_t": "她因為生病不得不休學一年。", "exen": "She had to take a year off school because of illness.", "tip": "休学 + length of time (休学一年). Different from 退学, which means dropping out for good.", "bl": "由于压力太大，他决定___半年，好好休息。", "bl_t": "由於壓力太大，他決定___半年，好好休息。"}, {"set": 1, "s": "不堪重负", "s_t": "不堪重負", "py": "bù kān zhòng fù", "m": "unable to bear a heavy burden", "pos": "idiom (成语)", "ex": "繁重的功课让很多学生不堪重负。", "ex_t": "繁重的功課讓很多學生不堪重負。", "exen": "Heavy schoolwork leaves many students overwhelmed.", "tip": "Takes no object: 让 / 使 + someone + 不堪重负.", "bl": "每天做作业到深夜，很多中学生已经___。", "bl_t": "每天做作業到深夜，很多中學生已經___。"}, {"set": 1, "s": "轻生", "s_t": "輕生", "py": "qīng shēng", "m": "to take one's own life", "pos": "verb", "ex": "压力太大时，一定要向家人或老师寻求帮助。社会也应该关心青少年，防止他们产生轻生的念头。", "ex_t": "壓力太大時，一定要向家人或老師尋求幫助。社會也應該關心青少年，防止他們產生輕生的念頭。", "exen": "When pressure is too great, always seek help from family or teachers. Society should also care for young people so they never think of taking their own lives.", "tip": "A formal word used in news and essays about pressure. Common phrase: 轻生的念头.", "bl": "学校开设心理辅导课，希望帮助压力大的学生，避免他们产生___的念头。", "bl_t": "學校開設心理輔導課，希望幫助壓力大的學生，避免他們產生___的念頭。"}, {"set": 1, "s": "理所当然", "s_t": "理所當然", "py": "lǐ suǒ dāng rán", "m": "to take for granted / naturally so", "pos": "idiom (成语)", "ex": "很多孩子把父母的照顾当作理所当然的事。", "ex_t": "很多孩子把父母的照顧當作理所當然的事。", "exen": "Many children take their parents' care for granted.", "tip": "把……当作 / 视为理所当然; 理所当然地 + verb.", "bl": "我们不应该把父母的付出看成是___的。", "bl_t": "我們不應該把父母的付出看成是___的。"}, {"set": 1, "s": "不菲", "s_t": "不菲", "py": "bù fěi", "m": "expensive / considerable (cost)", "pos": "adjective", "ex": "补习班的费用不菲。", "ex_t": "補習班的費用不菲。", "exen": "Tutoring classes cost a lot.", "tip": "Formal: 价格不菲 / 费用不菲 / 价值不菲.", "bl": "这些名牌球鞋价格___，很多学生买不起。", "bl_t": "這些名牌球鞋價格___，很多學生買不起。"}, {"set": 1, "s": "无疑", "s_t": "無疑", "py": "wú yí", "m": "undoubtedly / no doubt", "pos": "adverb", "ex": "你的努力无疑会得到回报。", "ex_t": "你的努力無疑會得到回報。", "exen": "Your hard work will undoubtedly pay off.", "tip": "无疑 + 是 / 会 / verb. Similar: 毫无疑问.", "bl": "对学生来说，健康___比分数更重要。", "bl_t": "對學生來説，健康___比分數更重要。"}, {"set": 1, "s": "含辛茹苦", "s_t": "含辛茹苦", "py": "hán xīn rú kǔ", "m": "to endure all kinds of hardships", "pos": "idiom (成语)", "ex": "母亲含辛茹苦地把我们养大。", "ex_t": "母親含辛茹苦地把我們養大。", "exen": "Mother went through great hardship to raise us.", "tip": "Usually about parents: 含辛茹苦地把……抚养长大. Don't use it for small, everyday things.", "bl": "父母___地把我们抚养长大，我们应该孝顺他们。", "bl_t": "父母___地把我們撫養長大，我們應該孝順他們。"}, {"set": 1, "s": "误入歧途", "s_t": "誤入歧途", "py": "wù rù qí tú", "m": "to go astray / to be led astray", "pos": "idiom (成语)", "ex": "缺少家人关心的孩子容易误入歧途。", "ex_t": "缺少家人關心的孩子容易誤入歧途。", "exen": "Children who lack family care can easily go astray.", "tip": "Takes no object. 防止 / 避免青少年误入歧途.", "bl": "家长要多关心孩子，以免他们交上坏朋友，___。", "bl_t": "家長要多關心孩子，以免他們交上壞朋友，___。"}, {"set": 1, "s": "悲哀", "s_t": "悲哀", "py": "bēi āi", "m": "sorrowful / tragic; sorrow", "pos": "adjective / noun", "ex": "为了分数失去快乐的童年，真是一种悲哀。", "ex_t": "為了分數失去快樂的童年，真是一種悲哀。", "exen": "Losing a happy childhood for the sake of grades is truly sad.", "tip": "Useful essay phrase: ……是一种悲哀; also 感到悲哀.", "bl": "孩子们每天只会读书，不会玩，这是教育的___。", "bl_t": "孩子們每天只會讀書，不會玩，這是教育的___。"}, {"set": 1, "s": "优异", "s_t": "優異", "py": "yōu yì", "m": "excellent / outstanding", "pos": "adjective", "ex": "他以优异的成绩考上了大学。", "ex_t": "他以優異的成績考上了大學。", "exen": "He got into university with outstanding results.", "tip": "Formal, used with results and performance: 优异的成绩 / 表现优异. For a person, 优秀 is more natural.", "bl": "她在比赛中表现___，获得了第一名。", "bl_t": "她在比賽中表現___，獲得了第一名。"}, {"set": 1, "s": "茁壮成长", "s_t": "茁壯成長", "py": "zhuó zhuàng chéng zhǎng", "m": "to grow up strong and sturdy", "pos": "verb phrase", "ex": "在父母的关爱下，孩子们茁壮成长。", "ex_t": "在父母的關愛下，孩子們茁壯成長。", "exen": "With their parents' love, the children grew up strong.", "tip": "Takes no object: say 让孩子茁壮成长, not 茁壮成长孩子.", "bl": "良好的家庭环境能让孩子健康、___。", "bl_t": "良好的家庭環境能讓孩子健康、___。"}, {"set": 1, "s": "万灵药", "s_t": "萬靈藥", "py": "wàn líng yào", "m": "cure-all / panacea", "pos": "noun", "ex": "补习并不是提高成绩的万灵药。", "ex_t": "補習並不是提高成績的萬靈藥。", "exen": "Tutoring is not a cure-all for better grades.", "tip": "Usually used in the negative: ……不是万灵药.", "bl": "金钱不是解决所有问题的___。", "bl_t": "金錢不是解決所有問題的___。"}, {"set": 1, "s": "提倡", "s_t": "提倡", "py": "tí chàng", "m": "to advocate / to promote", "pos": "verb", "ex": "学校提倡学生多参加体育活动。", "ex_t": "學校提倡學生多參加體育活動。", "exen": "The school encourages students to do more sport.", "tip": "Actively promoting a behaviour, often by schools or governments. Compare 主张, which means holding a view.", "bl": "政府___大家节约用水，保护环境。", "bl_t": "政府___大家節約用水，保護環境。"}, {"set": 2, "s": "跨国婚姻", "s_t": "跨國婚姻", "py": "kuà guó hūn yīn", "m": "cross-national (mixed) marriage", "pos": "noun", "ex": "在香港，跨国婚姻越来越普遍。", "ex_t": "在香港，跨國婚姻越來越普遍。", "exen": "Cross-national marriages are becoming more common in Hong Kong.", "tip": "跨国 means across countries, as in 跨国公司 (a multinational company).", "bl": "我爸爸是英国人，妈妈是中国人，他们是___。", "bl_t": "我爸爸是英國人，媽媽是中國人，他們是___。"}, {"set": 2, "s": "观众", "s_t": "觀眾", "py": "guān zhòng", "m": "audience", "pos": "noun", "ex": "演出结束后，观众热烈鼓掌。", "ex_t": "演出結束後，觀眾熱烈鼓掌。", "exen": "After the show, the audience applauded warmly.", "tip": "For people who watch (shows, TV, matches). People who listen (radio, speeches) are 听众.", "bl": "这个电视节目很受年轻___的欢迎。", "bl_t": "這個電視節目很受年輕___的歡迎。"}, {"set": 2, "s": "不听话", "s_t": "不聽話", "py": "bù tīng huà", "m": "disobedient", "pos": "adjective", "ex": "弟弟很不听话，常常不做作业。", "ex_t": "弟弟很不聽話，常常不做作業。", "exen": "My younger brother is disobedient and often skips his homework.", "tip": "Usually about children. 听话 means obedient.", "bl": "孩子___的时候，父母应该耐心地跟他沟通。", "bl_t": "孩子___的時候，父母應該耐心地跟他溝通。"}, {"set": 2, "s": "脾气急", "s_t": "脾氣急", "py": "pí qì jí", "m": "short-tempered", "pos": "adjective phrase", "ex": "爷爷脾气急，一点小事就会生气。", "ex_t": "爺爺脾氣急，一點小事就會生氣。", "exen": "Grandpa is short-tempered and gets angry over small things.", "tip": "Someone 的脾气很急. Same meaning as 急性子.", "bl": "他___，排队等五分钟就不耐烦了。", "bl_t": "他___，排隊等五分鐘就不耐煩了。"}, {"set": 2, "s": "照顾", "s_t": "照顧", "py": "zhào gù", "m": "to take care of", "pos": "verb", "ex": "父母上班的时候，奶奶负责照顾我。", "ex_t": "父母上班的時候，奶奶負責照顧我。", "exen": "While my parents are at work, Grandma looks after me.", "tip": "照顾 + person; 照顾好自己 (take good care of yourself).", "bl": "姐姐生病了，妈妈在家___她。", "bl_t": "姐姐生病了，媽媽在家___她。"}, {"set": 2, "s": "宠爱", "s_t": "寵愛", "py": "chǒng ài", "m": "to dote on / to spoil", "pos": "verb", "ex": "祖父母往往特别宠爱孙子孙女。", "ex_t": "祖父母往往特別寵愛孫子孫女。", "exen": "Grandparents often especially dote on their grandchildren.", "tip": "宠爱 + person; 受到宠爱. 过分宠爱 (over-indulging) is negative.", "bl": "他是家里唯一的孩子，父母都很___他。", "bl_t": "他是家裏唯一的孩子，父母都很___他。"}, {"set": 2, "s": "叫喊", "s_t": "叫喊", "py": "jiào hǎn", "m": "to shout", "pos": "verb", "ex": "他生气的时候总是大声叫喊。", "ex_t": "他生氣的時候總是大聲叫喊。", "exen": "He always shouts loudly when he's angry.", "tip": "Usually 大声叫喊, with no object. To call someone, use 喊 + person.", "bl": "请不要在图书馆里大声___。", "bl_t": "請不要在圖書館裏大聲___。"}, {"set": 2, "s": "惩罚", "s_t": "懲罰", "py": "chéng fá", "m": "to punish; punishment", "pos": "verb / noun", "ex": "他上课迟到，被老师惩罚了。", "ex_t": "他上課遲到，被老師懲罰了。", "exen": "He was late to class and got punished by the teacher.", "tip": "惩罚 + person; 受到惩罚; 被……惩罚.", "bl": "有些父母认为孩子犯错就应该受到___。", "bl_t": "有些父母認為孩子犯錯就應該受到___。"}, {"set": 2, "s": "主张", "s_t": "主張", "py": "zhǔ zhāng", "m": "to advocate / to recommend; view", "pos": "verb / noun", "ex": "爸爸主张对孩子严格一点。", "ex_t": "爸爸主張對孩子嚴格一點。", "exen": "Dad believes in being a bit strict with children.", "tip": "主张 + clause = hold the view that…, a personal opinion. 提倡 = actively promote.", "bl": "我___父母多花时间跟孩子沟通，而不是只给他们钱。", "bl_t": "我___父母多花時間跟孩子溝通，而不是隻給他們錢。"}, {"set": 2, "s": "协议", "s_t": "協議", "py": "xié yì", "m": "agreement", "pos": "noun", "ex": "我和父母达成了协议：做完作业才可以玩游戏。", "ex_t": "我和父母達成了協議：做完作業才可以玩遊戲。", "exen": "My parents and I reached an agreement: games only after homework.", "tip": "达成协议 / 签订协议.", "bl": "经过讨论，双方终于达成了___。", "bl_t": "經過討論，雙方終於達成了___。"}, {"set": 2, "s": "态度", "s_t": "態度", "py": "tài dù", "m": "attitude", "pos": "noun", "ex": "他的学习态度很认真。", "ex_t": "他的學習態度很認真。", "exen": "He has a serious attitude towards studying.", "tip": "对……的态度; 态度 + 好 / 认真 / 积极.", "bl": "老师说，成功的关键是积极的___。", "bl_t": "老師説，成功的關鍵是積極的___。"}, {"set": 2, "s": "有耐心", "s_t": "有耐心", "py": "yǒu nài xīn", "m": "patient", "pos": "adjective", "ex": "妈妈对我很有耐心。", "ex_t": "媽媽對我很有耐心。", "exen": "Mum is very patient with me.", "tip": "对 + person + 有耐心; the opposite is 没有耐心.", "bl": "教小孩子的时候一定要___。", "bl_t": "教小孩子的時候一定要___。"}, {"set": 2, "s": "隔代人", "s_t": "隔代人", "py": "gé dài rén", "m": "people of different generations", "pos": "noun", "ex": "隔代人之间常常有代沟。", "ex_t": "隔代人之間常常有代溝。", "exen": "There is often a generation gap between people of different generations.", "tip": "Related: 隔代教育 (grandparents raising grandchildren), 代沟 (generation gap).", "bl": "爷爷和我是___，我们对很多事情的看法不一样。", "bl_t": "爺爺和我是___，我們對很多事情的看法不一樣。"}, {"set": 2, "s": "个性独立", "s_t": "個性獨立", "py": "gè xìng dú lì", "m": "independent personality", "pos": "adjective phrase", "ex": "她个性独立，什么事都喜欢自己做决定。", "ex_t": "她個性獨立，什麼事都喜歡自己做決定。", "exen": "She is independent and likes to make her own decisions.", "tip": "Someone 个性独立; 培养独立的个性.", "bl": "我希望自己___，不总是依赖父母。", "bl_t": "我希望自己___，不總是依賴父母。"}, {"set": 2, "s": "各有利弊", "s_t": "各有利弊", "py": "gè yǒu lì bì", "m": "each has pros and cons", "pos": "idiom", "ex": "住校和住在家里各有利弊。", "ex_t": "住校和住在家裏各有利弊。", "exen": "Boarding and living at home each have pros and cons.", "tip": "Great essay phrase: A 和 B 各有利弊.", "bl": "中式教育和西式教育___，我们应该取长补短。", "bl_t": "中式教育和西式教育___，我們應該取長補短。"}, {"set": 2, "s": "行为标准", "s_t": "行為標準", "py": "xíng wéi biāo zhǔn", "m": "standard of behaviour", "pos": "noun", "ex": "每个国家的行为标准都不一样。", "ex_t": "每個國家的行為標準都不一樣。", "exen": "Every country has different standards of behaviour.", "tip": "符合行为标准; 不同文化有不同的行为标准.", "bl": "在不同的文化里，有礼貌的___也不一样。", "bl_t": "在不同的文化裏，有禮貌的___也不一樣。"}, {"set": 2, "s": "困惑", "s_t": "困惑", "py": "kùn huò", "m": "confused / puzzled", "pos": "adjective / noun", "ex": "面对父母不同的要求，我感到很困惑。", "ex_t": "面對父母不同的要求，我感到很困惑。", "exen": "Facing my parents' different demands, I feel confused.", "tip": "感到困惑 / 让人困惑.", "bl": "这道数学题让我很___，不知道怎么做。", "bl_t": "這道數學題讓我很___，不知道怎麼做。"}, {"set": 3, "s": "入乡随俗", "s_t": "入鄉隨俗", "py": "rù xiāng suí sú", "m": "When in Rome, do as the Romans do", "pos": "idiom (成语)", "ex": "去日本旅行时，我们应该入乡随俗。", "ex_t": "去日本旅行時，我們應該入鄉隨俗。", "exen": "When travelling in Japan, we should follow local customs.", "tip": "Used as the main verb: 要 / 应该入乡随俗.", "bl": "到了别的国家，就要___，尊重当地的习惯。", "bl_t": "到了別的國家，就要___，尊重當地的習慣。"}, {"set": 3, "s": "风俗习惯", "s_t": "風俗習慣", "py": "fēng sú xí guàn", "m": "customs and habits", "pos": "noun", "ex": "每个地方都有自己的风俗习惯。", "ex_t": "每個地方都有自己的風俗習慣。", "exen": "Every place has its own customs.", "tip": "尊重 / 了解当地的风俗习惯.", "bl": "我们去旅行前应该先了解当地的___。", "bl_t": "我們去旅行前應該先了解當地的___。"}, {"set": 3, "s": "遵守", "s_t": "遵守", "py": "zūn shǒu", "m": "to comply with / to abide by", "pos": "verb", "ex": "学生必须遵守校规。", "ex_t": "學生必須遵守校規。", "exen": "Students must follow the school rules.", "tip": "遵守 + 规则 / 法律 / 纪律 / 时间 / 承诺. The opposite is 违反.", "bl": "开车的时候一定要___交通规则。", "bl_t": "開車的時候一定要___交通規則。"}, {"set": 3, "s": "了解", "s_t": "了解", "py": "liǎo jiě", "m": "to understand / to know about", "pos": "verb", "ex": "我想多了解中国的历史。", "ex_t": "我想多瞭解中國的歷史。", "exen": "I want to learn more about Chinese history.", "tip": "了解 + thing or person; 对……有了解.", "bl": "交朋友之前，要先___他的性格。", "bl_t": "交朋友之前，要先___他的性格。"}, {"set": 3, "s": "闹笑话", "s_t": "鬧笑話", "py": "nào xiào huà", "m": "to make a fool of oneself", "pos": "verb", "ex": "他不懂当地的习惯，闹了不少笑话。", "ex_t": "他不懂當地的習慣，鬧了不少笑話。", "exen": "He didn't know the local customs and embarrassed himself quite a few times.", "tip": "Separable: 闹了一个笑话 / 闹出笑话. It takes no person as object.", "bl": "我刚学中文的时候，常常因为发音不准而___。", "bl_t": "我剛學中文的時候，常常因為發音不準而___。"}, {"set": 3, "s": "问候", "s_t": "問候", "py": "wèn hòu", "m": "to send greetings to", "pos": "verb / noun", "ex": "请替我问候你的父母。", "ex_t": "請替我問候你的父母。", "exen": "Please give my regards to your parents.", "tip": "问候 + person; 向……问候; 替我问候…….", "bl": "见到老师的时候，我们应该主动向他___。", "bl_t": "見到老師的時候，我們應該主動向他___。"}, {"set": 3, "s": "相互/互相", "s_t": "相互/互相", "py": "xiāng hù / hù xiāng", "m": "mutual / each other", "pos": "adverb", "ex": "朋友之间应该互相帮助。", "ex_t": "朋友之間應該互相幫助。", "exen": "Friends should help each other.", "tip": "Both go before the verb (互相帮助 / 相互尊重), and the subject must be plural. 相互 can also go before a noun (相互关系).", "bl": "不同文化的人应该___尊重。", "bl_t": "不同文化的人應該___尊重。"}, {"set": 3, "s": "热情", "s_t": "熱情", "py": "rè qíng", "m": "enthusiastic / warm; enthusiasm", "pos": "adjective / noun", "ex": "当地人热情地欢迎我们。", "ex_t": "當地人熱情地歡迎我們。", "exen": "The locals welcomed us warmly.", "tip": "热情地 + verb; 对……很热情; 热情好客.", "bl": "那里的人___好客，让我们感觉像在家一样。", "bl_t": "那裏的人___好客，讓我們感覺像在家一樣。"}, {"set": 3, "s": "微笑", "s_t": "微笑", "py": "wēi xiào", "m": "to smile; smile", "pos": "verb / noun", "ex": "她总是面带微笑。", "ex_t": "她總是面帶微笑。", "exen": "She always has a smile on her face.", "tip": "面带微笑; 对……微笑.", "bl": "服务员___着对我们说：“欢迎光临！”", "bl_t": "服務員___著對我們説：“歡迎光臨！”"}, {"set": 3, "s": "主动", "s_t": "主動", "py": "zhǔ dòng", "m": "to take the initiative; proactive", "pos": "adjective / adverb", "ex": "他主动帮老人拿行李。", "ex_t": "他主動幫老人拿行李。", "exen": "He offered to carry the elderly man's luggage without being asked.", "tip": "主动 + verb (主动帮忙 / 主动问好). The opposite is 被动.", "bl": "遇到新同学，你应该___跟他打招呼。", "bl_t": "遇到新同學，你應該___跟他打招呼。"}, {"set": 3, "s": "双手合十", "s_t": "雙手合十", "py": "shuāng shǒu hé shí", "m": "to put palms together (prayer, blessing, thanks)", "pos": "verb phrase", "ex": "在寺庙里，人们双手合十祈祷。", "ex_t": "在寺廟裏，人們雙手合十祈禱。", "exen": "In the temple, people put their palms together to pray.", "tip": "Common in Thailand and Buddhist settings for greeting, thanks or prayer.", "bl": "在泰国，人们见面时通常会___，表示问候。", "bl_t": "在泰國，人們見面時通常會___，表示問候。"}, {"set": 3, "s": "礼貌", "s_t": "禮貌", "py": "lǐ mào", "m": "courtesy / manners; polite", "pos": "noun / adjective", "ex": "他是一个很有礼貌的孩子。", "ex_t": "他是一個很有禮貌的孩子。", "exen": "He is a very polite child.", "tip": "有礼貌 / 没礼貌 / 礼貌地 + verb.", "bl": "跟长辈说话要有___。", "bl_t": "跟長輩説話要有___。"}, {"set": 3, "s": "鞠躬", "s_t": "鞠躬", "py": "jū gōng", "m": "to bow", "pos": "verb", "ex": "在日本，人们见面时常常鞠躬。", "ex_t": "在日本，人們見面時常常鞠躬。", "exen": "In Japan, people often bow when they meet.", "tip const SETNAMES = {1:"Set 1 · 社会与压力",2:"Set 2 · 家庭与代沟",3:"Set 3 · 风俗与礼貌",0:"All 54"};

const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

function flash(deck,enFirst,isTricky){
  let i=0,flipped=false,known=0,total=deck.length;
  function render(){
    if(i>=deck.length){return done()}
    const w=deck[i];
    const front = enFirst?`<div class="mean" style="font-size:26px">${esc(w.m)}</div><div class="pos">${w.pos}</div>`:`<div class="big">${T(w,"s")}</div>`;
    const back = `<div class="big" style="font-size:44px">${T(w,"s")}</div><div class="py">${w.py}</div><div class="pos">${w.pos}</div><div class="mean">${esc(w.m)}</div>
      <div class="ex">${T(w,"ex")}</div><div class="exen">${esc(w.exen)}</div><div class="tip">💡 ${esc(w.tip)}</div>`;
    app.innerHTML=`<header><button class="btn small" id="back">← Home</button><div class="stats"><span>${Math.min(known,total)}/${total} known</span></div></header>
    <div class="bar"><div style="width:${known/total*100}%"></div></div>
    <div class="panel flash" id="card">${flipped?back:front}${flipped?"":`<div class="hint">Tap card or press Space to flip</div>`}</div>
    <div class="row ${flipped?"":"hidden"}"><button class="btn bad" id="again">😅 Still learning (1)</button><button class="btn ok" id="got">✅ Got it (2)</button></div>
    ${isTricky&&flipped?`<div class="row" style="margin-top:10px"><button class="btn small" id="untrick">Remove from tricky words</button></div>`:""}`;
    $("#back").onclick=home;
    $("#card").onclick=()=>{flipped=!flipped;render()};
    if(flipped){$("#again").onclick=again;$("#got").onclick=got;}
    if($("#untrick"))$("#untrick").onclick=()=>{tricky.delete(w.s);save();got()};
  }
  function got(){known++;i++;flipped=false;render()}
  function again(){const w=deck[i];tricky.add(w.s);save();deck.splice(i,1);deck.splice(Math.min(deck.length,i+3),0,w);flipped=false;render()}
  function done(){keyHandler=null;app.innerHTML=`<div class="panel"><div class="cele">🎉</div><p class="q">Deck finished! ${total} words reviewed.</p>
    <div class="row"><button class="btn primary" id="q">Take a quick quiz</button><button class="btn" id="h">Home</button></div></div>`;$("#q").onclick=()=>quiz("mixed");$("#h").onclick=home}
  keyHandler=e=>{if(e.code==="Space"){e.preventDefault();flipped=!flipped;render()}else if(flipped&&e.key==="1")again();else if(flipped&&e.key==="2")got();else if(e.key==="Escape")home()};
  render();
}

const GROUPS=[["绝望","沮丧","悲哀","困惑","不堪重负"],["茁壮","茁壮成长","优异"],["主张","提倡"],["急躁","脾气急","不听话"],["宠爱","照顾"],["风俗习惯","行为标准"],["热情","礼貌","有耐心","主动"],["无疑","理所当然"]];
const clash=(a,b)=>GROUPS.some(g=>g.includes(a.s)&&g.includes(b.s));
function distract(w,n,field){
  const okW=W.filter(x=>x!==w&&!clash(w,x));
  let same=okW.filter(x=>x.set===w.set);
  let samePos=same.filter(x=>x.pos.split(" ")[0]===w.pos.split(" ")[0]);
  let c=shuffle(samePos).concat(shuffle(same)).concat(shuffle(okW));
  const out=[];const seen=new Set([w[field]]);
  for(const x of c){if(!seen.has(x[field])){seen.add(x[field]);out.push(x)}if(out.length>=n)break}
  return out;
}
function makeQ(type,w){
  if(type==="c2e"){const opts=shuffle([w,...distract(w,3,"m")]);return{w,html:`What does <div class="cn">${T(w,"s")}</div> mean?`,opts:opts.map(o=>esc(o.m)),ans:opts.indexOf(w),fb:`${T(w,"s")} (${w.py}) = ${esc(w.m)}`}}
  if(type==="e2c"){const opts=shuffle([w,...distract(w,3,"s")]);return{w,html:`Which word means<br><b>“${esc(w.m)}”</b>?`,opts:opts.map(o=>T(o,"s")),ans:opts.indexOf(w),fb:`${T(w,"s")} (${w.py}) = ${esc(w.m)}`}}
  if(type==="blank"){const opts=shuffle([w,...distract(w,3,"s")]);return{w,html:`Fill in the blank:<br><span style="font-size:24px">${T(w,"bl").replace("___","<u>&nbsp;&nbsp;?&nbsp;&nbsp;</u>")}</span>`,opts:opts.map(o=>T(o,"s")),ans:opts.indexOf(w),fb:`${T(w,"bl").replace("___","<b>"+T(w,"s")+"</b>")} 💡 ${esc(w.tip)}`}}
  if(type==="use"){const u=U.find(x=>x.w===w.s);const idx=shuffle([0,1,2,3]);return{w,html:`Which sentence uses <span class="cn" style="font-size:26px">${T(w,"s")}</span> correctly?`,opts:idx.map(k=>S.script==="t"?u.o_t[k]:u.o[k]),ans:idx.indexOf(0),fb:esc(u.e)}}
}
function quiz(mode){
  const p=shuffle(pool());const n=S.len?Math.min(S.len,p.length):p.length;
  const words=p.slice(0,n);
  const qs=words.map(w=>{
    const hasU=U.some(x=>x.w===w.s);
    let types = mode==="meaning"?["c2e","e2c"]:mode==="usage"?(hasU?["blank","use"]:["blank"]):(hasU?["c2e","e2c","blank","use"]:["c2e","e2c","blank"]);
    return makeQ(types[Math.floor(Math.random()*types.length)],w);
  });
  runQuiz(qs,mode);
}
function runQuiz(qs,mode){
  let i=0,score=0,streak=0,best=0,answered=false;const missed=[];
  function render(){
    if(i>=qs.length)return end();
    const q=qs[i];answered=false;
    app.innerHTML=`<header><button class="btn small" id="back">← Home</button><div class="stats"><span>Q${i+1}/${qs.length}</span>&nbsp;&nbsp;<span>Score ${score}</span>&nbsp;&nbsp;<span class="streak">${streak>=2?"🔥 "+streak:""}</span></div></header>
    <div class="bar"><div style="width:${i/qs.length*100}%"></div></div>
    <div class="panel"><div class="q">${q.html}</div><div class="opts">${q.opts.map((o,k)=>`<button class="opt" data-k="${k}">${k+1}. ${o}</button>`).join("")}</div>
    <div class="fb" id="fb"></div><div class="row hidden" id="nextrow" style="margin-top:12px"><button class="btn primary" id="next">Next → (Enter)</button></div></div>`;
    $("#back").onclick=home;
    app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>pick(+b.dataset.k));
    $("#next").onclick=next;
  }
  function pick(k){
    if(answered)return;answered=true;const q=qs[i];const btns=app.querySelectorAll(".opt");
    btns[q.ans].classList.add("right");
    const fb=$("#fb");
    if(k===q.ans){score++;streak++;best=Math.max(best,streak);fb.className="fb ok";fb.innerHTML="✅ Correct! "+q.fb}
    else{btns[k].classList.add("wrong");streak=0;missed.push(q.w);fb.className="fb bad";fb.innerHTML="❌ Not quite. "+q.fb}
    $("#nextrow").classList.remove("hidden");
  }
  function next(){i++;render()}
  function end(){
    keyHandler=e=>{if(e.key==="Escape")home()};
    const pct=Math.round(score/qs.length*100);
    const uniq=[...new Map(missed.map(w=>[w.s,w])).values()];
    app.innerHTML=`<div class="panel">${pct>=80?`<div class="cele">${pct===100?"🏆":"🌟"}</div>`:""}
     <div class="score">${score}/${qs.length}</div><p style="text-align:center;color:var(--muted)">${pct}% · best streak ${best} ${pct===100?"· Perfect!":pct>=80?"· Great job!":pct>=50?"· Getting there!":"· Keep practising!"}</p>
     ${uniq.length?`<p class="label">Words to review</p><ul class="missed">${uniq.map(w=>`<li><b>${T(w,"s")}</b> ${w.py}, ${esc(w.m)}</li>`).join("")}</ul>`:""}
     <div class="row" style="margin-top:14px">${uniq.length?`<button class="btn primary" id="retry">Retry missed</button><button class="btn" id="addt">⭐ Add to tricky words</button>`:""}<button class="btn" id="again">New quiz</button><button class="btn" id="h">Home</button></div></div>`;
    if(uniq.length){$("#retry").onclick=()=>{const qs2=uniq.map(w=>{const hasU=U.some(x=>x.w===w.s);const t=mode==="meaning"?["c2e","e2c"]:hasU?["blank","use","c2e"]:["blank","c2e"];return makeQ(t[Math.floor(Math.random()*t.length)],w)});runQuiz(shuffle(qs2),mode)};
      $("#addt").onclick=e=>{uniq.forEach(w=>tricky.add(w.s));save();e.target.textContent="✓ Added";e.target.disabled=true}}
    $("#again").onclick=()=>quiz(mode);$("#h").onclick=home;
  }
  keyHandler=e=>{if(i>=qs.length)return;if(!answered&&["1","2","3","4"].includes(e.key))pick(+e.key-1);else if(answered&&(e.key==="Enter"||e.code==="Space")){e.preventDefault();next()}else if(e.key==="Escape")home()};
  render();
}
home();
</script>
</body>
